<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoopDeck - Video Loop Station</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tape-deck">
        <header class="deck-header">
            <div class="brand-logo">
                <span class="logo-text">LOOP</span><span class="logo-deck">DECK</span>
            </div>
            <div class="model-info">
                <span class="model">MODEL LD-90</span>
                <span class="serial">DIGITAL VIDEO LOOP STATION</span>
            </div>
            <div class="vu-meters">
                <div class="vu-meter" id="vu-left">
                    <div class="vu-bar"></div>
                </div>
                <div class="vu-meter" id="vu-right">
                    <div class="vu-bar"></div>
                </div>
            </div>
        </header>

        <main class="deck-main">
            <!-- Camera Preview -->
            <section class="camera-section">
                <div class="section-label">LIVE INPUT</div>
                <div class="camera-preview-container">
                    <video id="camera-preview" autoplay muted playsinline></video>
                    <div class="camera-overlay">
                        <span class="rec-indicator" id="rec-indicator">● REC</span>
                    </div>
                </div>
                <div class="camera-controls">
                    <button id="start-camera" class="deck-button">
                        <span class="button-icon">▶</span>
                        <span class="button-label">CAMERA</span>
                    </button>
                    <select id="camera-select" class="deck-select">
                        <option value="">Select Camera</option>
                    </select>
                </div>
            </section>

            <!-- Video Frames Grid -->
            <section class="frames-section">
                <div class="section-label">LOOP CHANNELS</div>
                <div class="frames-grid" id="frames-grid">
                    <!-- 6 video frames will be generated by JS -->
                </div>
            </section>

            <!-- Scene Controls -->
            <section class="scene-section">
                <div class="section-label">SCENE MEMORY</div>
                <div class="scene-controls">
                    <div class="scene-slots" id="scene-slots">
                        <!-- Scene slots will be generated by JS -->
                    </div>
                    <div class="scene-actions">
                        <button id="save-scene" class="deck-button secondary">
                            <span class="button-icon">◉</span>
                            <span class="button-label">SAVE</span>
                        </button>
                        <button id="clear-all" class="deck-button danger">
                            <span class="button-icon">⊗</span>
                            <span class="button-label">CLEAR ALL</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Timeline Section -->
            <section class="timeline-section">
                <div class="section-label">SONG TIMELINE</div>
                <div class="timeline-container">
                    <div class="timeline-track" id="timeline-track">
                        <!-- Timeline segments will be added here -->
                    </div>
                    <div class="timeline-controls">
                        <button id="add-segment" class="deck-button">
                            <span class="button-icon">+</span>
                            <span class="button-label">ADD SEGMENT</span>
                        </button>
                        <button id="play-timeline" class="deck-button primary">
                            <span class="button-icon">▶</span>
                            <span class="button-label">PLAY</span>
                        </button>
                        <button id="stop-timeline" class="deck-button">
                            <span class="button-icon">■</span>
                            <span class="button-label">STOP</span>
                        </button>
                        <button id="clear-timeline" class="deck-button danger">
                            <span class="button-icon">⊗</span>
                            <span class="button-label">CLEAR</span>
                        </button>
                    </div>
                    <div class="timeline-info">
                        <span class="time-display" id="timeline-duration">00:00 / 04:00</span>
                        <span class="segment-count" id="segment-count">0 segments</span>
                    </div>
                </div>
            </section>

            <!-- Master Controls -->
            <section class="master-section">
                <div class="section-label">MASTER CONTROL</div>
                <div class="master-controls">
                    <button id="play-all" class="deck-button large primary">
                        <span class="button-icon">▶▶</span>
                        <span class="button-label">PLAY ALL LOOPS</span>
                    </button>
                    <button id="stop-all" class="deck-button large">
                        <span class="button-icon">■■</span>
                        <span class="button-label">STOP ALL</span>
                    </button>
                    <div class="master-volume">
                        <label>MASTER VOL</label>
                        <input type="range" id="master-volume" min="0" max="100" value="80">
                    </div>
                </div>
            </section>
        </main>

        <footer class="deck-footer">
            <div class="led-strip">
                <div class="led active"></div>
                <div class="led"></div>
                <div class="led"></div>
                <div class="led"></div>
                <div class="led"></div>
            </div>
            <span class="copyright">© 1994 LoopDeck Industries</span>
            <div class="power-indicator">
                <span class="power-led"></span>
                <span>POWER</span>
            </div>
        </footer>
    </div>

    <!-- Segment Editor Modal -->
    <div class="modal" id="segment-modal">
        <div class="modal-content tape-style">
            <div class="modal-header">
                <span class="modal-title">CONFIGURE SEGMENT</span>
                <button class="modal-close" id="close-segment-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="segment-config">
                    <label>Duration (seconds):</label>
                    <input type="number" id="segment-duration" min="1" max="240" value="10">
                </div>
                <div class="segment-frames">
                    <label>Active Channels:</label>
                    <div class="frame-toggles" id="frame-toggles">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="confirm-segment" class="deck-button primary">ADD TO TIMELINE</button>
                <button id="cancel-segment" class="deck-button">CANCEL</button>
            </div>
        </div>
    </div>

    <!-- Scene Save Modal -->
    <div class="modal" id="scene-save-modal">
        <div class="modal-content tape-style">
            <div class="modal-header">
                <span class="modal-title">SAVE SCENE</span>
                <button class="modal-close" id="close-scene-modal">×</button>
            </div>
            <div class="modal-body">
                <div class="scene-config">
                    <label>Select Memory Slot:</label>
                    <div class="save-slots" id="save-slots">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
